<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Ilustração: do zero à primeira venda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea4a83"/><stop offset="1" stop-color="#c81f5c"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g fill="#fff" opacity=".12">
    <circle cx="1080" cy="110" r="190"/><circle cx="120" cy="690" r="160"/>
  </g>
  <!-- degraus subindo -->
  <g>
    <rect x="610" y="560" width="130" height="190" fill="#2b1245"/>
    <rect x="740" y="470" width="130" height="280" fill="#3d1d5e"/>
    <rect x="870" y="380" width="130" height="370" fill="#2b1245"/>
    <rect x="1000" y="290" width="200" height="460" fill="#3d1d5e"/>
  </g>
  <!-- seta saindo do zero -->
  <path d="M300 520 C 420 470, 560 420, 700 330 S 930 170, 1040 120" fill="none" stroke="#ffd166" stroke-width="22" stroke-linecap="round" stroke-dasharray="2 46"/>
  <path d="M1000 88 L1078 104 L1040 172 Z" fill="#ffd166"/>
  <!-- o zero -->
  <ellipse cx="300" cy="400" rx="170" ry="225" fill="none" stroke="#2b1245" stroke-width="70"/>
  <ellipse cx="300" cy="400" rx="170" ry="225" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="1 22" stroke-linecap="round" opacity=".7"/>
  <!-- balão -->
  <g transform="translate(450 110)">
    <rect width="440" height="130" rx="34" fill="#fff"/>
    <path d="M60 128 L40 190 L120 128 Z" fill="#fff"/>
    <text x="220" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#2b1245">Oi! Posso ajudar?</text>
  </g>
  <!-- brilhos -->
  <g fill="#ffd166">
    <path d="M160 120 l12 34 34 12 -34 12 -12 34 -12 -34 -34 -12 34 -12z"/>
    <path d="M540 610 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
    <path d="M1110 520 l10 28 28 10 -28 10 -10 28 -10 -28 -28 -10 28 -10z"/>
  </g>
</svg>
