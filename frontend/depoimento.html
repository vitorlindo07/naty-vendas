<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b1245">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<meta property="og:site_name" content="Naty Alves · Mentora de vendas">
<script type="module" src="/assets/js/site.js"></script>
<title>Deixar depoimento · Naty Alves</title>
<meta name="description" content="Conte como foi seu curso ou mentoria.">
<meta name="robots" content="noindex">
</head>
<body data-page="depoimento">
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header data-header></header>
<main id="conteudo">
  <div class="page-head"><div class="wrap"><h1>Deixe seu depoimento</h1><p>Fez um curso ou uma mentoria? Conte como foi. Ele aparece no site depois de revisado.</p></div></div>
  <section class="section"><div class="wrap" style="max-width:720px">
    <form class="form" id="review-form" novalidate>
      <div class="notice" hidden></div>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <fieldset class="field" style="border:0;padding:0;margin:0"><legend>Nota</legend><div class="rating">
        <input type="radio" id="r5" name="rating" value="5" checked><label for="r5" title="5 estrelas">★</label>
        <input type="radio" id="r4" name="rating" value="4"><label for="r4" title="4 estrelas">★</label>
        <input type="radio" id="r3" name="rating" value="3"><label for="r3" title="3 estrelas">★</label>
        <input type="radio" id="r2" name="rating" value="2"><label for="r2" title="2 estrelas">★</label>
        <input type="radio" id="r1" name="rating" value="1"><label for="r1" title="1 estrela">★</label></div></fieldset>
      <div class="row-2">
        <div class="field"><label for="t-author">Seu nome</label><input class="input" id="t-author" name="author" required data-msg="Informe seu nome."></div>
        <div class="field"><label for="t-role">Curso ou mentoria que fez</label><input class="input" id="t-role" name="role" placeholder="Ex.: aluna do Vendas do Zero"></div>
      </div>
      <div class="field"><label for="t-text">Como foi?</label><textarea class="input" id="t-text" name="text" required minlength="10" maxlength="800" data-msg="Escreva pelo menos 10 caracteres."></textarea></div>
      <div><button class="btn btn-hot" type="submit">Enviar depoimento</button></div>
    </form></div></section>
</main>
<footer data-footer></footer>
</body>
</html>
